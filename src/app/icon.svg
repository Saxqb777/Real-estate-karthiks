<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Pattukottai Estates mark: a Tamil Nadu townhouse (flat roof, parapet, black water tank,
       external staircase) on a marigold tile with a laterite-earth base and Chettinad studs. -->
  <defs>
    <clipPath id="tile"><rect width="64" height="64" rx="12"/></clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC56A"/>
      <stop offset="1" stop-color="#FF9C3F"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="64" height="64" fill="url(#sky)"/>
    <rect y="50" width="64" height="14" fill="#B5532E"/>
    <rect y="50" width="64" height="2" fill="#7A3418"/>
    <rect x="6" y="56" width="3" height="3" fill="#F3E9D8" opacity=".8"/>
    <rect x="30.5" y="56" width="3" height="3" fill="#F3E9D8" opacity=".8"/>
    <rect x="55" y="56" width="3" height="3" fill="#F3E9D8" opacity=".8"/>
    <!-- water tank -->
    <rect x="16" y="11" width="10" height="9" rx="2" fill="#15120F"/>
    <!-- parapet + body -->
    <rect x="11" y="20" width="35" height="4" fill="#15120F"/>
    <rect x="13" y="23" width="31" height="27" fill="#15120F"/>
    <!-- external staircase -->
    <path d="M44 28h3.5v5h3.5v5h3.5v5h3.5v7H44z" fill="#15120F"/>
    <!-- lit windows + door -->
    <rect x="17.5" y="28" width="7" height="6" fill="#FFB547"/>
    <rect x="32.5" y="28" width="7" height="6" fill="#FFB547"/>
    <rect x="25.5" y="39" width="6" height="11" fill="#FFB547"/>
  </g>
</svg>
